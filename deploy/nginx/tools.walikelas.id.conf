# Nginx Reverse Proxy Configuration
# WaliKelas Teaching Tools V1 (tools.walikelas.id)
#
# Web: 127.0.0.1:3006 (Next.js)
# API & WebSockets: 127.0.0.1:4006 (NestJS + Socket.IO)

upstream walikelas_web {
    server 127.0.0.1:3006;
    keepalive 32;
}

upstream walikelas_api {
    server 127.0.0.1:4006;
    keepalive 32;
}

# HTTP — Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tools.walikelas.id;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Main Application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tools.walikelas.id;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tools.walikelas.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tools.walikelas.id/privkey.pem;

    # SSL Security Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body limit for quiz/note assets
    client_max_body_size 10M;

    # WebSocket Proxy: Socket.IO & Realtime Sessions
    location /socket.io/ {
        proxy_pass http://walikelas_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # API Endpoints
    location /api/ {
        proxy_pass http://walikelas_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Next.js Static Assets Caching
    location /_next/static/ {
        proxy_pass http://walikelas_web/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Files (favicon, robots, etc.)
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
        proxy_pass http://walikelas_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Frontend Application (Next.js SSR / HTML)
    location / {
        proxy_pass http://walikelas_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

